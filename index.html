header{padding:14px 16px 2px;display:flex;align-items:center;gap:6px}
header .brand{font-size:17px;font-weight:700}
#main{flex:1;padding:8px 16px 84px}
button,input,select,textarea{font:inherit;color:inherit}
h2{font-size:20px;margin:4px 0 3px;font-weight:700}
.sub{color:var(--mut);font-size:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:13px;margin-bottom:10px}
.hero{background:var(--greenDk);color:#fff;border-radius:18px;padding:14px;margin-bottom:14px}
.hero .lbl{color:var(--lime);font-size:11px;font-weight:600;letter-spacing:.03em}
.hero .big{font-size:26px;font-weight:700;font-family:Poppins}
.row{display:flex;gap:8px;flex-wrap:wrap}
.tile{flex:1;min-width:100px;border-radius:12px;padding:10px 12px;font-weight:600;font-size:12px;text-align:left;border:none;cursor:pointer}
.tile.lime{background:var(--lime);color:var(--greenDk)}
.tile.white{background:#fff;color:var(--ink)}
.btn{display:block;width:100%;background:var(--green);color:#fff;border:none;border-radius:99px;padding:13px;font-weight:600;font-size:14px;margin:6px 0;cursor:pointer;text-align:center}
.btn.soft{background:var(--mint);color:var(--green)}
.btn.warn{background:var(--warn);color:var(--warnTx)}
.pill{background:var(--mint);color:var(--green);border:none;border-radius:99px;padding:8px 14px;font-weight:600;font-size:12px;cursor:pointer}
.pill.on{background:var(--green);color:#fff}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:11px;background:#fff;margin:3px 0 9px;font-size:14px}
label{display:block;font-size:10px;font-weight:600;color:var(--mut);letter-spacing:.02em;margin-top:7px}
.item{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:8px;cursor:pointer}
.item .ic{width:38px;height:38px;border-radius:10px;background:var(--mint);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.item .nm{font-weight:600;overflow-wrap:break-word;font-size:14px}
.item .loc{color:var(--mut);font-size:11px;overflow-wrap:break-word}
.item .dt{color:#b5651d;font-weight:600;font-size:12px;overflow-wrap:break-word}
.item>div{min-width:0}
@media(max-width:380px){#main{padding-left:12px;padding-right:12px}header{padding-left:12px;padding-right:12px}.hero{padding:12px}.tile{min-width:90px;padding:9px 10px;font-size:11px}}
.badge{display:inline-block;background:var(--warn);color:var(--warnTx);font-size:11px;font-weight:700;letter-spacing:.03em;padding:4px 10px;border-radius:8px;margin:6px 0}
.note{background:var(--mint);border-radius:12px;padding:12px;font-size:13px;margin:10px 0}
.warnbox{background:var(--warn);color:var(--warnTx);border-radius:12px;padding:12px;font-size:13px;margin:10px 0}
.warnbox b{display:block;margin-bottom:2px}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--bd);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;color:var(--mut);cursor:pointer;padding:3px}
nav.tabs button.on{color:var(--green);font-weight:700}
nav.tabs .ic{display:flex}
.ico-row{display:inline-flex;align-items:center;gap:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .dow{color:var(--mut);font-size:11px;font-weight:600;padding:4px 0}
.cal .day{padding:8px 0;border-radius:10px;background:#fff;border:1px solid var(--bd);font-size:13px;cursor:pointer;position:relative}
.cal .day.has:after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:99px;background:var(--green)}
.cal .day.sel{background:var(--lime);border-color:var(--lime);font-weight:700}
.cal .empty{visibility:hidden}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead button{background:var(--mint);border:none;border-radius:10px;width:32px;height:32px;color:var(--green);font-weight:700;cursor:pointer}
.err{color:#c0392b;font-size:13px;margin:4px 0}
.confirm{text-align:center;padding:30px 10px}
.confirm .box{background:var(--lime);border-radius:20px;padding:26px;margin-bottom:16px}
.confirm .box h2{margin:8px 0 0}

<script type="module">

};
function ic(name,size,color){
  const s=size||18,c=color||'currentColor';
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0">${ICON_PATHS[name]||ICON_PATHS.package}</svg>`;
}
const CATS={'Food':'food','Drinks':'drink','Cooked food':'bowl','Other supplies':'package'};
const PICKABLE=['Food','Drinks','Other supplies'];
function normCat(c){return c==='Food & drinks'?'Food':c}
function catIcon(cat,size){return ic(CATS[normCat(cat)]||'package',size||20,'var(--green)')}
const LOCS=['Fridge','Freezer','Shelf'];
const LOC_OTHER='Other location';
const DISHES=['Chicken adobo','Meat or vegetable soup','Egg casserole'];
const DAY=86400000;
const fmt=t=>t?new Date(t).toLocaleDateString('en-US',{day:'numeric',month:'long',year:'numeric'}):'';
const fmtdt=t=>t?new Date(t).toLocaleString('en-US',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'';
let db,items=[],ready=0,view='home',selDate=null,calY,calM,delId='',flagIds=new Set();
let addStep='pick',addDraft={},cookDraft={},outDraft={},cookStep='dish';
function isoDate(t){if(!t)return '';const d=new Date(t),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
function todayLocal(){const d=new Date();d.setHours(0,0,0,0);return d.getTime()}
async function init(){
  try{const app=initializeApp(FIREBASE_CONFIG),fs=getFirestore(app);
    db={collection:n=>({onSnapshot:(f,e)=>onSnapshot(collection(fs,n),f,e),doc:id=>({set:d=>setDoc(doc(fs,n,id),d),update:d=>updateDoc(doc(fs,n,id),d),delete:()=>deleteDoc(doc(fs,n,id))})})}}catch(e){db=null}
  if(!db){$('#main').innerHTML='<div class="card err">Firebase is not set up yet. Paste your firebaseConfig at the top of the script.</div>';return}
  const d=new Date();calY=d.getFullYear();calM=d.getMonth();
  db.collection('items').onSnapshot(s=>{items=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(a.useBy||0)-(b.useBy||0));ready|=1;render()});
}

function tabs(){
  const t=[['home','home','Home'],['items','box','Items'],['calendar','calendar','Calendar'],['scan','barcode','Scan'],['alerts','bell','Alerts']];
  $('#tabs').innerHTML=t.map(x=>`<button class="${view===x[0]?'on':''}" data-a="tab" data-v="${x[0]}"><span class="ic">${ic(x[1],18)}</span>${x[2]}</button>`).join('');
}
function render(){
  if(!(ready&1))return;
  tabs();
  if(view==='home')$('#main').innerHTML=homeHTML();
  else if(view==='items')$('#main').innerHTML=itemsHTML();
  else if(view==='detail')$('#main').innerHTML=detailHTML();
  else if(view==='add')$('#main').innerHTML=addHTML();
  else if(view==='scan')$('#main').innerHTML=scanHTML();
  else if(view==='cooked')$('#main').innerHTML=cookedHTML();
  else if(view==='calendar')$('#main').innerHTML=calendarHTML();
  else if(view==='alerts')$('#main').innerHTML=alertsHTML();
  else if(view==='saved')$('#main').innerHTML=savedHTML();
}
function homeHTML(){
  const up=items.slice(0,2);
  return `<div class="hero"><div class="lbl">AT A GLANCE</div><div class="row" style="align-items:center;margin:6px 0 12px">
    <div style="font-size:34px;font-weight:700;font-family:Poppins">${items.length}</div>
    <div style="flex:1"><div>Tracked items</div><a data-a="tab" data-v="items" style="color:var(--lime);font-size:12px;text-decoration:underline;cursor:pointer">View inventory</a></div></div>
    <div class="row"><button class="tile lime" data-a="tab" data-v="calendar"><span class="ico-row">${ic('calendar',15)}Expiry calendar</span></button><button class="tile white" data-a="tab" data-v="items"><span class="ico-row">${ic('fridge',15)}Storage filters</span></button></div></div>
  <div class="row" style="align-items:center;margin-bottom:8px"><h3 style="flex:1;margin:0">Coming up</h3><a data-a="tab" data-v="alerts" style="color:var(--green);font-size:13px;font-weight:600;cursor:pointer">View alerts →</a></div>
  ${up.length?up.map(i=>itemRow(i)).join(''):'<div class="card sub">No items tracked yet.</div>'}
  <button class="btn" data-a="tab" data-v="add">+ Add item</button>`;
}
function itemRow(i){
  return `<div class="item" data-a="open" data-id="${i.id}"><div class="ic">${catIcon(i.category,20)}</div>
  <div style="flex:1"><div class="nm">${esc(i.name)}</div><div class="loc">${esc(i.location)}</div><div class="dt">${fmt(i.useBy)}</div></div></div>`;
}
function itemsHTML(){
  return `<h2>Household items</h2><div class="sub">Household essentials, organized.</div>
  <input id="q" placeholder="Search your items" value="${esc(window._q||'')}">
  <div class="row" style="margin-bottom:12px"><button class="pill" data-a="filter">Filters</button><button class="pill" data-a="sort">Sort: ${window._sort==='expiry'?'Expiry':'A-Z'}</button></div>
  ${filtered().length?filtered().map(itemRow).join(''):'<div class="card sub">No items match.</div>'}
  <button class="btn" data-a="tab" data-v="add">+ Add item</button>`;
}
function filtered(){
  let l=items.slice();
  if(window._q)l=l.filter(i=>i.name.toLowerCase().includes(window._q.toLowerCase()));
  if(window._sort==='expiry')l.sort((a,b)=>(a.useBy||0)-(b.useBy||0));else l.sort((a,b)=>a.name.localeCompare(b.name));
  return l;
}
function detailHTML(){
  const i=items.find(x=>x.id===window._openId);if(!i)return '<div class="card">Item not found.</div>';
  return `<button class="pill" data-a="tab" data-v="items">← Back</button>
  <div class="card" style="text-align:center;background:var(--mint);border:none;margin-top:12px">
  <div style="display:flex;justify-content:center">${catIcon(i.category,34)}</div><h2>${esc(i.name)}</h2><div class="sub">${esc(i.qty||'')}</div>
  <div class="badge">${i.type==='cooked'?'ESTIMATED USE-BY':'USE-BY DATE'}</div><div class="sub">${esc(i.category)}</div></div>
  <label>Stored in</label><input disabled value="${esc(i.location)}">
  <label>Use-by date</label><input disabled value="${fmt(i.useBy)}">
  <label>Opened on</label><input disabled value="${i.openedOn?fmt(i.openedOn):'Not opened'}">
  <div class="note">Follow the label's storage and after-opening instructions. A tracked date is not a safety check.</div>
  <button class="btn" data-a="used" data-id="${i.id}">Mark as used</button>
  <button class="btn soft" data-a="editItem" data-id="${i.id}">Edit item details</button>
  <button class="btn ${delId===i.id?'warn':''}" style="background:none;color:#c0392b;font-weight:600" data-a="remove" data-id="${i.id}">${delId===i.id?'Tap again to confirm removal':'Remove item'}</button>`;
}
function addHTML(){
  const d=addDraft,nc=normCat(d.category||'Food');
  const selCat=PICKABLE.includes(nc)?nc:'Other supplies';
  const customCat=PICKABLE.includes(nc)||nc==='Other supplies'?'':nc;
  const selLoc=!d.location||LOCS.includes(d.location)?(d.location||'Fridge'):LOC_OTHER;
  const customLoc=LOCS.includes(d.location)||!d.location||d.location===LOC_OTHER?'':d.location;
  const ed=!!d.editId,isCooked=d.type==='cooked';
  return `<button class="pill" ${ed?`data-a="open" data-id="${d.editId}"`:'data-a="tab" data-v="home"'}>← Back</button>
  <h2 style="margin-top:12px">${ed?'Edit item':'Add item'}</h2><div class="sub">${ed?'Change the details, then save. This updates the same item.':"Enter the item's details, or track cooked food instead."}</div>
  <label>Item name</label><input id="f_name" value="${esc(d.name||'')}" placeholder="e.g. Fresh milk">
  <div style="display:${isCooked?'none':'block'}"><label>Category</label><select id="f_cat">${PICKABLE.map(c=>`<option ${selCat===c?'selected':''}>${c}</option>`).join('')}</select>
  <div id="f_catwrap" style="display:${selCat==='Other supplies'?'block':'none'}"><label>Your category</label><input id="f_catcustom" value="${esc(customCat)}" placeholder="e.g. Pet food, Batteries"></div></div>
  <div class="row"><div style="flex:1"><label>Quantity</label><input id="f_qtyn" type="number" min="1" value="${d.qtyn||1}"></div>
  <div style="flex:1"><label>Unit</label><input id="f_qtyu" value="${esc(d.qtyu!==undefined?d.qtyu:'bottle')}"></div></div>

  <div id="f_locwrap" style="display:${selLoc===LOC_OTHER?'block':'none'}"><label>Your storage location</label><input id="f_loccustom" value="${esc(customLoc)}" placeholder="e.g. Pantry, Cooler box, Desk drawer"></div>

const PRESET_ING=['Chicken','Pork / beef','Fish / seafood','Eggs','Milk / cream','Vegetables','Rice'];
const COND_OPTS=['Fresh ingredients; dish fully cooked','Contains previously cooked leftovers','Not sure / an ingredient was spoiled'];
function cookedHTML(){
  if(cookStep==='ingredients')return cookedIngredientsHTML();
  if(cookStep==='condition')return cookedConditionHTML();
  if(cookStep==='sample')return cookedSampleHTML();
  if(cookStep==='form')return cookedFormHTML();
  if(cookStep==='estimate')return cookedEstimateHTML();
  return cookedDishHTML();
}
function cookedDishHTML(){
  const d=cookDraft;

  <label>Ingredients</label><div class="card" data-a="cookGo" data-v="ingredients" style="cursor:pointer">${d.ingredients&&d.ingredients.length?esc(d.ingredients.join(' · ')):'Tap to add ingredients'}</div>

function cookedIngredientsHTML(){

  <button class="btn" data-a="cookGo" data-v="dish">Done</button>`;

function cookedConditionHTML(){
  return `<button class="pill" data-a="cookGo" data-v="dish">← Back</button>
  <h2 style="margin-top:12px">Check ingredients</h2><div class="sub">Choose the statement that matches this batch.</div>
  ${COND_OPTS.map(c=>`<button class="btn ${cookDraft.ingredientCond===c?'':'soft'}" data-a="setCond" data-v="${esc(c)}">${esc(c)}</button>`).join('')}
  <div class="sub" style="margin-top:10px">Cooking or reheating does not make spoiled ingredients safe, or restart the age of older leftovers.</div>`;
}
function cookedFormHTML(){
  const d=cookDraft;
  return `<button class="pill" data-a="cookGo" data-v="dish">← Back</button>
  <h2 style="margin-top:12px">Cooked food</h2><div class="sub">Add your dish, ingredients and storage history.</div>
  <label>Dish</label><div class="card" data-a="cookGo" data-v="dish" style="cursor:pointer">${esc(d.dishName||'')}</div>
  <label>Ingredients</label><div class="card" data-a="cookGo" data-v="ingredients" style="cursor:pointer">${d.ingredients&&d.ingredients.length?esc(d.ingredients.join(' · ')):'None added'}</div>
  <label>Ingredient condition</label><div class="card" data-a="cookGo" data-v="condition" style="cursor:pointer">${esc(d.ingredientCond||'Not set')}</div>
  <label>Cooked on</label><input id="c_on" type="datetime-local">
  <label>Refrigerated after cooking</label><select id="c_cool"><option>Within 1 hour</option><option>Between 1 and 2 hours</option><option>More than 2 hours</option><option>Unknown</option></select>
  <label>Room temperature</label><select id="c_room"><option>32°C or below</option><option>Above 32°C</option><option>Unknown</option></select>
  <label>Storage</label><select id="c_store"><option>Fridge · 4°C or below</option><option>Temperature unknown</option><option>Freezer</option><option>Room temperature · Shelf</option></select>
  <div class="err" id="c_err"></div>
  <button class="btn" data-a="calcCooked">Calculate use-by estimate</button>`;

function cookedEstimateHTML(){
  const d=cookDraft;
  return `<button class="pill" data-a="cookGo" data-v="form">← Back</button>
  <h2 style="margin-top:12px">Use-by estimate</h2><div class="sub">An estimate depends on the storage history.</div>
  <label>Dish</label><input disabled value="${esc(d.dishName)}">
  <label>Cooked on</label><input disabled value="${fmtdt(d.cookedOn)}">
  <div class="warnbox"><b>ESTIMATED USE-BY · NOT A SAFETY GUARANTEE</b>${fmtdt(d.useBy)}</div>
  <div class="note">For this dish, FreshTrack uses a conservative ${d.days}-day reminder from cooking based on the ingredients and storage conditions you gave.</div>
  <button class="btn" data-a="saveCooked">Save batch</button>`;
}
function calcUseBy(){
  const on=$('#c_on').value;if(!on){$('#c_err').textContent='Pick when it was cooked.';return}
  const cooked=new Date(on).getTime();
  const cool=$('#c_cool').value,room=$('#c_room').value,store=$('#c_store').value;
  let days=3;
  if(cool!=='Within 1 hour'||store!=='Fridge · 4°C or below'||room==='Above 32°C'||cookDraft.ingredientCond!=='Fresh ingredients; dish fully cooked')days=1;
  const useBy=cooked+days*DAY;
  cookDraft.cookedOn=cooked;cookDraft.cool=cool;cookDraft.roomTemp=room;cookDraft.storage=store;cookDraft.useBy=useBy;cookDraft.days=days;
  cookStep='estimate';render();
}
let scanState='idle',scanErr='';
function scanHTML(){
  if(scanState==='idle'){
    return `<h2>Scan an item</h2><div class="sub">Use your phone's rear camera to read a product label.</div>
    <div data-a="openCamera" style="cursor:pointer;position:relative;background:var(--greenDk);border-radius:16px;overflow:hidden;height:38vh;max-height:280px;min-height:190px;margin-bottom:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff">
      <div style="width:120px;height:120px;border:3px solid var(--lime);border-radius:14px;position:relative;margin-bottom:10px">
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">${ic('barcode',44,'#fff')}</div>
      </div>
      <div style="font-weight:700;position:absolute;bottom:36px;left:16px;font-size:14px">Label scan</div>
      <div style="position:absolute;bottom:14px;left:16px;font-size:10px;opacity:.75;letter-spacing:.03em">TAP TO OPEN THE BACK CAMERA</div>
    </div>
    ${scanErr?`<div class="err">${esc(scanErr)}</div>`:''}
    <div class="sub">Allow camera access, scan the label, then confirm the item details.</div>
    <button class="btn" data-a="openCamera">Open back camera</button>
    <button class="btn soft" data-a="tab" data-v="add">Enter item manually</button>
    <button class="btn soft" data-a="tab" data-v="cooked">Add cooked food / leftovers</button>`;
  }
  return `<h2>Point. Scan. Track.</h2><div class="sub">Align the product label inside the frame.</div>
  <div style="position:relative;background:#0f2a1c;border-radius:16px;overflow:hidden;height:38vh;max-height:280px;min-height:190px;margin-bottom:10px">
    <video id="scanVideo" playsinline muted style="width:100%;height:100%;object-fit:cover;display:block"></video>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none">
      <div style="width:150px;height:150px;border:3px solid var(--lime);border-radius:14px"></div>
    </div>
  </div>
  <div class="err" id="scanMsg"></div>
  <button class="btn soft" data-a="tab" data-v="add">Enter item manually</button>
  <button class="btn soft" data-a="tab" data-v="cooked">Add cooked food / leftovers</button>`;
}
const scanCanvasEl=document.createElement('canvas');
let camStream=null,scanning=false,scanRAF=null;
async function startScan(){
  scanErr='';
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=$('#scanVideo');if(!v)return;
    v.srcObject=camStream;await v.play();
    scanning=true;scanLoop();
  }catch(e){
    scanErr='Camera access was denied or is unavailable on this browser. Try "Enter item manually" below.';
    scanState='idle';render();
  }
}
function stopScan(){
  scanning=false;
  if(scanRAF)cancelAnimationFrame(scanRAF);
  if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}
}
function scanLoop(){
  if(!scanning)return;
  const v=$('#scanVideo');
  if(v&&v.readyState===v.HAVE_ENOUGH_DATA&&window.jsQR){
    scanCanvasEl.width=v.videoWidth;scanCanvasEl.height=v.videoHeight;
    const ctx=scanCanvasEl.getContext('2d');
    ctx.drawImage(v,0,0,scanCanvasEl.width,scanCanvasEl.height);
    const img=ctx.getImageData(0,0,scanCanvasEl.width,scanCanvasEl.height);
    const code=window.jsQR(img.data,img.width,img.height);
    if(code&&code.data){onScanResult(code.data);return}
  }
  scanRAF=requestAnimationFrame(scanLoop);
}
function onScanResult(text){
  stopScan();scanState='idle';
  addDraft={name:text.slice(0,60)};
  view='add';render();
}
function alertsHTML(){
  return `<h2>Expiry reminders</h2><div class="sub">Your nearest dates, in one view.</div>
  <div class="note">Daily reminders are on · 8:00 AM · 1 day before the saved date</div>
  ${items.length?items.slice(0,8).map(itemRow).join(''):'<div class="card sub">Nothing tracked yet.</div>'}`;
}
function calendarHTML(){
  const first=new Date(calY,calM,1),startDow=(first.getDay()+6)%7,days=new Date(calY,calM+1,0).getDate();
  const marks={};items.forEach(i=>{if(i.useBy){const dd=new Date(i.useBy);if(dd.getFullYear()===calY&&dd.getMonth()===calM)marks[dd.getDate()]=true}});
  let cells='';for(let e=0;e<startDow;e++)cells+='<div class="empty"></div>';
  for(let dnum=1;dnum<=days;dnum++){const isSel=selDate===dnum;cells+=`<div class="day ${marks[dnum]?'has':''} ${isSel?'sel':''}" data-a="pickday" data-d="${dnum}">${dnum}</div>`}
  const monthName=first.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const sel=selDate?new Date(calY,calM,selDate).getTime():null;
  const onDay=sel?items.filter(i=>i.useBy&&new Date(i.useBy).toDateString()===new Date(sel).toDateString()):[];
  return `<h2>Expiry calendar</h2><div class="sub">Tap a date to see what needs attention.</div>
  <div class="calhead"><button data-a="mo" data-d="-1">‹</button><b>${monthName}</b><button data-a="mo" data-d="1">›</button></div>
  <div class="cal">${['M','T','W','T','F','S','S'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>
  <div class="note" style="margin-top:16px">● Saved expiry / estimated use-by</div>
  ${sel?`<h3>${fmt(sel)}</h3>${onDay.length?onDay.map(itemRow).join(''):'<div class="sub">Nothing due this day.</div>'}`:''}`;
}
function savedHTML(){
  const i=items.find(x=>x.id===window._savedId);
  return `<div class="confirm"><div class="box"><div style="display:flex;justify-content:center;margin-bottom:6px">${ic('check',40,'var(--greenDk)')}</div><h2>One less thing to remember.</h2></div>
  ${i?itemRow(i):''}
  <button class="btn" data-a="tab" data-v="items">View my inventory</button>
  <button class="btn soft" data-a="tab" data-v="add">Add another item</button></div>`;
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==='tab'){
    const newV=b.dataset.v;
    addDraft={};
    if(view==='scan'&&newV!=='scan'){stopScan();scanState='idle'}
    if(newV==='cooked'&&view!=='cooked'){cookStep='dish';cookDraft={}}
    view=newV;if(view!=='items')delId='';render();
  }
  else if(a==='openCamera'){scanState='active';render();startScan()}
  else if(a==='open'){window._openId=id;view='detail';render()}
  else if(a==='used'||a==='remove'){
    if(a==='remove'&&delId!==id){delId=id;render();return}
    try{await db.collection('items').doc(id).delete()}catch(err){alert('Could not update: '+err.message)}
    delId='';view='items';render();
  }
  else if(a==='editItem'){const i=items.find(x=>x.id===id);const m=String(i.qty||'').match(/^(\d+(?:\.\d+)?)\s*(.*)$/);addDraft={editId:i.id,type:i.type,name:i.name,category:i.category,qtyn:m?m[1]:1,qtyu:m?m[2]:(i.qty||''),location:i.location,useBy:i.useBy,openedOn:i.openedOn};view='add';render()}
  else if(a==='filter'){window._sort=window._sort;render()}
  else if(a==='sort'){window._sort=window._sort==='expiry'?'az':'expiry';render()}
  else if(a==='saveItem'){
    const name=$('#f_name').value.trim();if(!name){$('#f_err').textContent='Item name is required.';return}
    const use=$('#f_use').value?new Date($('#f_use').value).getTime():todayLocal()+7*DAY;
    const open=$('#f_open').value?new Date($('#f_open').value).getTime():null;
    const ed=addDraft.editId,wasCooked=addDraft.type==='cooked';
    const catSel=$('#f_cat').value,catCustom=($('#f_catcustom')?$('#f_catcustom').value:'').trim();
    const category=wasCooked?'Cooked food':(catSel==='Other supplies'&&catCustom?catCustom:catSel);
    const locSel=$('#f_loc').value,locCustom=($('#f_loccustom')?$('#f_loccustom').value:'').trim();
    const location=locSel===LOC_OTHER?(locCustom||'Other location'):locSel;
    const qty=`${$('#f_qtyn').value} ${$('#f_qtyu').value}`.trim();
    if(ed){
      await db.collection('items').doc(ed).update({name,category,qty,location,useBy:use,openedOn:open});
      addDraft={};window._openId=ed;view='detail';render();return;
    }
    const idn='i'+Date.now();
    await db.collection('items').doc(idn).set({name,category,qty,location,useBy:use,openedOn:open,type:'packaged',created:Date.now()});
    addDraft={};window._savedId=idn;view='saved';render();
  }
  else if(a==='cookGo'){
    const nameEl=$('#cd_name');if(nameEl)cookDraft.dishName=nameEl.value;
    cookStep=b.dataset.v;render();
  }
  else if(a==='useDishDetails'){
    const nameEl=$('#cd_name');cookDraft.dishName=(nameEl?nameEl.value:cookDraft.dishName||'').trim();
    if(!cookDraft.dishName){alert('Enter a dish name first.');return}
    cookStep='form';render();
  }
  else if(a==='pickSample'){cookDraft.dishName=b.dataset.v;cookStep='dish';render()}
  else if(a==='toggleIng'){
    cookDraft.ingredients=cookDraft.ingredients||[];
    const v=b.dataset.v,i=cookDraft.ingredients.indexOf(v);
    if(i>-1)cookDraft.ingredients.splice(i,1);else cookDraft.ingredients.push(v);
    render();
  }
  else if(a==='addCustomIng'){
    const v=prompt('Ingredient name:');
    if(v&&v.trim()){cookDraft.ingredients=cookDraft.ingredients||[];cookDraft.ingredients.push(v.trim())}
    render();
  }
  else if(a==='setCond'){cookDraft.ingredientCond=b.dataset.v;cookStep='dish';render()}
  else if(a==='calcCooked')calcUseBy();
  else if(a==='saveCooked'){
    const idn='i'+Date.now();
    await db.collection('items').doc(idn).set({name:cookDraft.dishName,category:'Cooked food',qty:'1 batch',location:(cookDraft.storage||'').includes('Freezer')?'Freezer':'Fridge',useBy:cookDraft.useBy,openedOn:null,type:'cooked',ingredients:cookDraft.ingredients||[],ingredientCond:cookDraft.ingredientCond||'',created:Date.now()});
    cookDraft={};cookStep='dish';window._savedId=idn;view='saved';render();
  }
  else if(a==='pickday'){selDate=Number(b.dataset.d);render()}
  else if(a==='mo'){calM+=Number(b.dataset.d);if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}selDate=null;render()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='f_cat'){const w=$('#f_catwrap');if(w)w.style.display=e.target.value==='Other supplies'?'block':'none'}
  if(e.target.id==='f_loc'){const w=$('#f_locwrap');if(w)w.style.display=e.target.value===LOC_OTHER?'block':'none'}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){window._q=e.target.value;render();setTimeout(()=>{const el=$('#q');if(el){el.focus();el.selectionStart=el.selectionEnd=el.value.length}},0)}});
init();
</script></body></html>
