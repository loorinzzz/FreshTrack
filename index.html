<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FreshTrack by ShelfSense</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5ef;--ink:#16231c;--mut:#6b7a70;--green:#1f6b45;--greenDk:#123322;--lime:#d7ea9b;--mint:#e3efdc;--warn:#f8dcb0;--warnTx:#9a4b12;--card:#fff;--bd:#e2e0d3}
*{box-sizing:border-box;min-width:0}html{background:var(--bg);overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden;max-width:100vw;zoom:.5}
h1,h2,h3,.brand{font-family:Poppins,sans-serif}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{padding:14px 16px 2px;display:flex;align-items:center;gap:6px}
header .brand{font-size:17px;font-weight:700}
main{flex:1;padding:8px 16px 84px}
button,input,select,textarea{font:inherit;color:inherit}
h2{font-size:20px;margin:4px 0 3px;font-weight:700}
.sub{color:var(--mut);font-size:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:13px;margin-bottom:10px}
.hero{background:var(--greenDk);color:#fff;border-radius:18px;padding:14px;margin-bottom:14px}
.hero .lbl{color:var(--lime);font-size:11px;font-weight:600;letter-spacing:.03em}
.hero .big{font-size:26px;font-weight:700;font-family:Poppins}
.row{display:flex;gap:8px;flex-wrap:wrap}
.tile{flex:1;min-width:100px;border-radius:12px;padding:10px 12px;font-weight:600;font-size:12px;text-align:left;border:none;cursor:pointer}
.tile.lime{background:var(--lime);color:var(--greenDk)}
.tile.white{background:#fff;color:var(--ink)}
.btn{display:block;width:100%;background:var(--green);color:#fff;border:none;border-radius:99px;padding:13px;font-weight:600;font-size:14px;margin:6px 0;cursor:pointer;text-align:center}
.btn.soft{background:var(--mint);color:var(--green)}
.btn.warn{background:var(--warn);color:var(--warnTx)}
.pill{background:var(--mint);color:var(--green);border:none;border-radius:99px;padding:8px 14px;font-weight:600;font-size:12px;cursor:pointer}
.pill.on{background:var(--green);color:#fff}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:11px;background:#fff;margin:3px 0 9px;font-size:14px}
label{display:block;font-size:10px;font-weight:600;color:var(--mut);letter-spacing:.02em;margin-top:7px}
.item{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:8px;cursor:pointer}
.item .ic{width:38px;height:38px;border-radius:10px;background:var(--mint);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.item .nm{font-weight:600;overflow-wrap:break-word;font-size:14px}
.item .loc{color:var(--mut);font-size:11px;overflow-wrap:break-word}
.item .dt{color:#b5651d;font-weight:600;font-size:12px;overflow-wrap:break-word}
.item>div{min-width:0}
@media(max-width:380px){main{padding-left:12px;padding-right:12px}header{padding-left:12px;padding-right:12px}.hero{padding:12px}.tile{min-width:90px;padding:9px 10px;font-size:11px}}
.badge{display:inline-block;background:var(--warn);color:var(--warnTx);font-size:11px;font-weight:700;letter-spacing:.03em;padding:4px 10px;border-radius:8px;margin:6px 0}
.note{background:var(--mint);border-radius:12px;padding:12px;font-size:13px;margin:10px 0}
.warnbox{background:var(--warn);color:var(--warnTx);border-radius:12px;padding:12px;font-size:13px;margin:10px 0}
.warnbox b{display:block;margin-bottom:2px}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--bd);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;color:var(--mut);cursor:pointer;padding:3px}
nav.tabs button.on{color:var(--green);font-weight:700}
nav.tabs .ic{font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .dow{color:var(--mut);font-size:11px;font-weight:600;padding:4px 0}
.cal .day{padding:8px 0;border-radius:10px;background:#fff;border:1px solid var(--bd);font-size:13px;cursor:pointer;position:relative}
.cal .day.has:after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:99px;background:var(--green)}
.cal .day.sel{background:var(--lime);border-color:var(--lime);font-weight:700}
.cal .empty{visibility:hidden}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead button{background:var(--mint);border:none;border-radius:10px;width:32px;height:32px;color:var(--green);font-weight:700;cursor:pointer}
.err{color:#c0392b;font-size:13px;margin:4px 0}
.confirm{text-align:center;padding:30px 10px}
.confirm .box{background:var(--lime);border-radius:20px;padding:26px;margin-bottom:16px}
.confirm .box h2{margin:8px 0 0}
</style></head>
<body><div class="app">
<header><span style="font-size:20px">🌿</span><span class="brand">FreshTrack</span></header>
<div id="main"><div class="card sub" style="margin-top:20px;text-align:center">🌿 Loading your household…</div></div>
<nav class="tabs" id="tabs"></nav>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,setDoc,updateDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
// PASTE YOUR FIREBASE CONFIG HERE (Firebase console > Project settings > Your apps > Web app)
const FIREBASE_CONFIG={
  apiKey:"AIzaSyCrSY4EA6dVLVcNzVjDwl26ezJmOpgr_Sg",
  authDomain:"freshtrack-d850c.firebaseapp.com",
  projectId:"freshtrack-d850c",
  storageBucket:"freshtrack-d850c.firebasestorage.app",
  messagingSenderId:"263246287895",
  appId:"1:263246287895:web:57cc101ce2f22856f2f852"
};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const CATS={'Food & drinks':'🥛','Cooked food':'🍲','Health & first aid':'💊','Personal care':'🧴','Cleaning supplies':'🧽','Other supplies':'📦'};
const LOCS=['Fridge','Freezer','Shelf','Medicine cabinet','Bathroom cabinet','Utility cupboard'];
const DISHES=['Chicken adobo','Meat or vegetable soup','Egg casserole'];
const DAY=86400000;
const fmt=t=>t?new Date(t).toLocaleDateString('en-US',{day:'numeric',month:'long',year:'numeric'}):'';
const fmtdt=t=>t?new Date(t).toLocaleString('en-US',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'';
let db,items=[],outages=[],ready=0,view='home',selDate=null,calY,calM,delId='',flagIds=new Set();
let addStep='pick',addDraft={},cookDraft={},outDraft={};
function todayLocal(){const d=new Date();d.setHours(0,0,0,0);return d.getTime()}
async function init(){
  try{const app=initializeApp(FIREBASE_CONFIG),fs=getFirestore(app);
    db={collection:n=>({onSnapshot:(f,e)=>onSnapshot(collection(fs,n),f,e),doc:id=>({set:d=>setDoc(doc(fs,n,id),d),update:d=>updateDoc(doc(fs,n,id),d),delete:()=>deleteDoc(doc(fs,n,id))})})}}catch(e){db=null}
  if(!db){$('#main').innerHTML='<div class="card err">Firebase is not set up yet. Paste your firebaseConfig at the top of the script.</div>';return}
  const d=new Date();calY=d.getFullYear();calM=d.getMonth();
  db.collection('items').onSnapshot(s=>{items=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(a.useBy||0)-(b.useBy||0));ready|=1;render()});
  db.collection('outages').onSnapshot(s=>{outages=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>b.start-a.start);ready|=2;render()});
}

function tabs(){
  const t=[['home','🏠','Home'],['items','🗂','Items'],['calendar','📅','Calendar'],['add','📷','Scan'],['alerts','🔔','Alerts']];
  $('#tabs').innerHTML=t.map(x=>`<button class="${view===x[0]?'on':''}" data-a="tab" data-v="${x[0]}"><span class="ic">${x[1]}</span>${x[2]}</button>`).join('');
}
function render(){
  if(!(ready&1))return;
  tabs();
  if(view==='home')$('#main').innerHTML=homeHTML();
  else if(view==='items')$('#main').innerHTML=itemsHTML();
  else if(view==='detail')$('#main').innerHTML=detailHTML();
  else if(view==='add')$('#main').innerHTML=addHTML();
  else if(view==='cooked')$('#main').innerHTML=cookedHTML();
  else if(view==='calendar')$('#main').innerHTML=calendarHTML();
  else if(view==='alerts')$('#main').innerHTML=alertsHTML();
  else if(view==='brownout')$('#main').innerHTML=brownoutHTML();
  else if(view==='saved')$('#main').innerHTML=savedHTML();
}
function homeHTML(){
  const up=items.slice(0,2);
  return `<div class="hero"><div class="lbl">AT A GLANCE</div><div class="row" style="align-items:center;margin:6px 0 12px">
    <div style="font-size:34px;font-weight:700;font-family:Poppins">${items.length}</div>
    <div style="flex:1"><div>Tracked items</div><a data-a="tab" data-v="items" style="color:var(--lime);font-size:12px;text-decoration:underline;cursor:pointer">View inventory</a></div></div>
    <div class="row"><button class="tile lime" data-a="tab" data-v="calendar">📅 Expiry calendar</button><button class="tile white" data-a="tab" data-v="items">🗄 Storage filters</button></div></div>
  <div class="row" style="align-items:center;margin-bottom:8px"><h3 style="flex:1;margin:0">Coming up</h3><a data-a="tab" data-v="alerts" style="color:var(--green);font-size:13px;font-weight:600;cursor:pointer">View alerts →</a></div>
  ${up.length?up.map(i=>itemRow(i)).join(''):'<div class="card sub">No items tracked yet.</div>'}
  <button class="btn soft" data-a="tab" data-v="brownout">Brownout Mode · Log an outage</button>
  <button class="btn" data-a="tab" data-v="add">+ Add item</button>`;
}
function itemRow(i){
  return `<div class="item" data-a="open" data-id="${i.id}"><div class="ic">${CATS[i.category]||'📦'}</div>
  <div style="flex:1"><div class="nm">${esc(i.name)}</div><div class="loc">${esc(i.location)}</div><div class="dt">${fmt(i.useBy)}</div></div></div>`;
}
function itemsHTML(){
  return `<h2>Household items</h2><div class="sub">Household essentials, organized.</div>
  <input id="q" placeholder="Search your items" value="${esc(window._q||'')}">
  <div class="row" style="margin-bottom:12px"><button class="pill" data-a="filter">Filters</button><button class="pill" data-a="sort">Sort: ${window._sort==='expiry'?'Expiry':'A-Z'}</button></div>
  ${filtered().length?filtered().map(itemRow).join(''):'<div class="card sub">No items match.</div>'}
  <button class="btn" data-a="tab" data-v="add">+ Add item</button>`;
}
function filtered(){
  let l=items.slice();
  if(window._q)l=l.filter(i=>i.name.toLowerCase().includes(window._q.toLowerCase()));
  if(window._sort==='expiry')l.sort((a,b)=>(a.useBy||0)-(b.useBy||0));else l.sort((a,b)=>a.name.localeCompare(b.name));
  return l;
}
function detailHTML(){
  const i=items.find(x=>x.id===window._openId);if(!i)return '<div class="card">Item not found.</div>';
  return `<button class="pill" data-a="tab" data-v="items">← Back</button>
  <div class="card" style="text-align:center;background:var(--mint);border:none;margin-top:12px">
  <div style="font-size:34px">${CATS[i.category]||'📦'}</div><h2>${esc(i.name)}</h2><div class="sub">${esc(i.qty||'')}</div>
  <div class="badge">${i.type==='cooked'?'ESTIMATED USE-BY':'USE-BY DATE'}</div><div class="sub">${esc(i.category)}</div></div>
  <label>Stored in</label><input disabled value="${esc(i.location)}">
  <label>Use-by date</label><input disabled value="${fmt(i.useBy)}">
  <label>Opened on</label><input disabled value="${i.openedOn?fmt(i.openedOn):'Not opened'}">
  <div class="note">Follow the label's storage and after-opening instructions. A tracked date is not a safety check.</div>
  <button class="btn" data-a="used" data-id="${i.id}">Mark as used</button>
  <button class="btn soft" data-a="editItem" data-id="${i.id}">Edit item details</button>
  <button class="btn ${delId===i.id?'warn':''}" style="background:none;color:#c0392b;font-weight:600" data-a="remove" data-id="${i.id}">${delId===i.id?'Tap again to confirm removal':'Remove item'}</button>`;
}
function addHTML(){
  const d=addDraft;
  return `<button class="pill" data-a="tab" data-v="home">← Back</button>
  <h2 style="margin-top:12px">Add item</h2><div class="sub">Enter the item's details, or track cooked food instead.</div>
  <label>Item name</label><input id="f_name" value="${esc(d.name||'')}" placeholder="e.g. Fresh milk">
  <label>Category</label><select id="f_cat">${Object.keys(CATS).filter(c=>c!=='Cooked food').map(c=>`<option ${d.category===c?'selected':''}>${c}</option>`).join('')}</select>
  <div class="row"><div style="flex:1"><label>Quantity</label><input id="f_qtyn" type="number" min="1" value="${d.qtyn||1}"></div>
  <div style="flex:1"><label>Unit</label><input id="f_qtyu" value="${esc(d.qtyu||'bottle')}"></div></div>
  <label>Storage location</label><select id="f_loc">${LOCS.map(l=>`<option ${d.location===l?'selected':''}>${l}</option>`).join('')}</select>
  <label>Package use-by date</label><input id="f_use" type="date">
  <label>Opened on (leave blank if unopened)</label><input id="f_open" type="date">
  <div class="err" id="f_err"></div>
  <button class="btn" data-a="saveItem">Save to my household</button>
  <button class="btn soft" data-a="tab" data-v="cooked">Add cooked food / leftovers instead</button>`;
}
function cookedHTML(){
  return `<button class="pill" data-a="tab" data-v="add">← Back</button>
  <h2 style="margin-top:12px">Cooked food</h2><div class="sub">Set a use-by reminder for a batch of leftovers.</div>
  <label>Dish</label><select id="c_dish">${DISHES.map(x=>`<option>${x}</option>`).join('')}</select>
  <label>Cooked on</label><input id="c_on" type="datetime-local">
  <label>Refrigerated after cooking</label><select id="c_cool"><option>Within 1 hour</option><option>Between 1 and 2 hours</option><option>More than 2 hours</option><option>Unknown</option></select>
  <label>Storage conditions</label><select id="c_store"><option>Fridge · 4°C or below</option><option>Temperature unknown</option><option>Freezer</option><option>Room temperature · Shelf</option></select>
  <label>Interruptions</label><select id="c_int"><option>Continuous refrigeration</option><option>Brownout affected this batch</option><option>Other interruption / unknown</option></select>
  <div class="err" id="c_err"></div>
  <button class="btn" data-a="calcCooked">Calculate use-by estimate</button>`;
}
function calcUseBy(){
  const on=$('#c_on').value;if(!on){$('#c_err').textContent='Pick when it was cooked.';return}
  const cooked=new Date(on).getTime();
  const cool=$('#c_cool').value,store=$('#c_store').value,intr=$('#c_int').value;
  let days=3;
  if(cool!=='Within 1 hour'||store!=='Fridge · 4°C or below'||intr!=='Continuous refrigeration')days=1;
  const useBy=cooked+days*DAY;
  cookDraft={dish:$('#c_dish').value,cookedOn:cooked,cool,store,intr,useBy,days};
  $('#main').innerHTML=`<button class="pill" data-a="tab" data-v="cooked">← Back</button>
  <h2 style="margin-top:12px">Use-by estimate</h2><div class="sub">An estimate depends on the storage history.</div>
  <label>Dish</label><input disabled value="${cookDraft.dish}">
  <label>Cooked on</label><input disabled value="${fmtdt(cooked)}">
  <div class="warnbox"><b>ESTIMATED USE-BY · NOT A SAFETY GUARANTEE</b>${fmtdt(useBy)}</div>
  <div class="note">For these sample dishes, FreshTrack uses a conservative ${days}-day reminder from cooking based on the storage conditions you gave.</div>
  <button class="btn" data-a="saveCooked">Save batch</button>`;
}
function alertsHTML(){
  return `<h2>Expiry reminders</h2><div class="sub">Your nearest dates, in one view.</div>
  <div class="note">Daily reminders are on · 8:00 AM · 1 day before the saved date</div>
  ${items.length?items.slice(0,8).map(itemRow).join(''):'<div class="card sub">Nothing tracked yet.</div>'}
  ${outages.length?'<div class="warnbox"><b>Brownout? Open outage assessment</b>Follow the printed expiry and any after-opening instructions.</div>':''}`;
}
function calendarHTML(){
  const first=new Date(calY,calM,1),startDow=(first.getDay()+6)%7,days=new Date(calY,calM+1,0).getDate();
  const marks={};items.forEach(i=>{if(i.useBy){const dd=new Date(i.useBy);if(dd.getFullYear()===calY&&dd.getMonth()===calM)marks[dd.getDate()]=true}});
  let cells='';for(let e=0;e<startDow;e++)cells+='<div class="empty"></div>';
  for(let dnum=1;dnum<=days;dnum++){const isSel=selDate===dnum;cells+=`<div class="day ${marks[dnum]?'has':''} ${isSel?'sel':''}" data-a="pickday" data-d="${dnum}">${dnum}</div>`}
  const monthName=first.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const sel=selDate?new Date(calY,calM,selDate).getTime():null;
  const onDay=sel?items.filter(i=>i.useBy&&new Date(i.useBy).toDateString()===new Date(sel).toDateString()):[];
  return `<h2>Expiry calendar</h2><div class="sub">Tap a date to see what needs attention.</div>
  <div class="calhead"><button data-a="mo" data-d="-1">‹</button><b>${monthName}</b><button data-a="mo" data-d="1">›</button></div>
  <div class="cal">${['M','T','W','T','F','S','S'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>
  <div class="note" style="margin-top:16px">● Saved expiry / estimated use-by</div>
  ${sel?`<h3>${fmt(sel)}</h3>${onDay.length?onDay.map(itemRow).join(''):'<div class="sub">Nothing due this day.</div>'}`:''}`;
}
function brownoutHTML(){
  return `<button class="pill" data-a="tab" data-v="home">← Back</button>
  <h2 style="margin-top:12px">Brownout Mode</h2><div class="sub">Log lost cooling and review affected items.</div>
  <label>Outage start</label><input id="o_start" type="datetime-local">
  <label>Affected location</label><select id="o_loc"><option>Fridge</option><option>Freezer</option><option>Room / cabinets</option></select>
  <label>Door during outage</label><select id="o_door"><option>Kept closed</option><option>Opened during outage</option><option>Unknown</option></select>
  <label>Backup cooling</label><select id="o_bak"><option>No backup cooling</option><option>Ice / cooler used</option><option>Backup power used</option><option>I don't know</option></select>
  <div class="warnbox"><b>An outage is not a new expiry date.</b>Cooling again does not undo exposure — review each item before deciding whether to keep it.</div>
  <button class="btn" data-a="saveOutage">Start outage log</button>`;
}
function savedHTML(){
  const i=items.find(x=>x.id===window._savedId);
  return `<div class="confirm"><div class="box">✅<h2>One less thing to remember.</h2></div>
  ${i?itemRow(i):''}
  <button class="btn" data-a="tab" data-v="items">View my inventory</button>
  <button class="btn soft" data-a="tab" data-v="add">Add another item</button></div>`;
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==='tab'){view=b.dataset.v;if(view!=='items')delId='';render()}
  else if(a==='open'){window._openId=id;view='detail';render()}
  else if(a==='used'||a==='remove'){
    if(a==='remove'&&delId!==id){delId=id;render();return}
    try{await db.collection('items').doc(id).delete()}catch(err){alert('Could not update: '+err.message)}
    delId='';view='items';render();
  }
  else if(a==='editItem'){const i=items.find(x=>x.id===id);addDraft={name:i.name,category:i.category,qtyn:1,location:i.location};view='add';render()}
  else if(a==='filter'){window._sort=window._sort;render()}
  else if(a==='sort'){window._sort=window._sort==='expiry'?'az':'expiry';render()}
  else if(a==='saveItem'){
    const name=$('#f_name').value.trim();if(!name){$('#f_err').textContent='Item name is required.';return}
    const use=$('#f_use').value?new Date($('#f_use').value).getTime():todayLocal()+7*DAY;
    const open=$('#f_open').value?new Date($('#f_open').value).getTime():null;
    const idn='i'+Date.now();
    await db.collection('items').doc(idn).set({name,category:$('#f_cat').value,qty:`${$('#f_qtyn').value} ${$('#f_qtyu').value}`,location:$('#f_loc').value,useBy:use,openedOn:open,type:'packaged',created:Date.now()});
    addDraft={};window._savedId=idn;view='saved';render();
  }
  else if(a==='calcCooked')calcUseBy();
  else if(a==='saveCooked'){
    const idn='i'+Date.now();
    await db.collection('items').doc(idn).set({name:cookDraft.dish,category:'Cooked food',qty:'1 batch',location:'Fridge',useBy:cookDraft.useBy,openedOn:null,type:'cooked',created:Date.now()});
    cookDraft={};window._savedId=idn;view='saved';render();
  }
  else if(a==='saveOutage'){
    const start=$('#o_start').value?new Date($('#o_start').value).getTime():Date.now();
    const idn='o'+Date.now();
    await db.collection('outages').doc(idn).set({start,location:$('#o_loc').value,door:$('#o_door').value,backup:$('#o_bak').value});
    view='alerts';render();
  }
  else if(a==='pickday'){selDate=Number(b.dataset.d);render()}
  else if(a==='mo'){calM+=Number(b.dataset.d);if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}selDate=null;render()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){window._q=e.target.value;render();setTimeout(()=>{const el=$('#q');if(el){el.focus();el.selectionStart=el.selectionEnd=el.value.length}},0)}});
init();
</script></body></html>
